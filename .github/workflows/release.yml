name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -race -ldflags="-extldflags=-Wl,-adhoc_codesign" ./...

  # Maintains a release pull request that accumulates the version bump and the
  # CHANGELOG.md entry. Merging that pull request is what creates the tag and the
  # GitHub release, which is when release_created turns true.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds and publishes artifacts into the release that already exists.
  #
  # This job lives in the same workflow as release-please on purpose. Anything
  # release-please creates with the default GITHUB_TOKEN - tag or release - does
  # not trigger another workflow run, so a separate tag-triggered workflow would
  # silently never fire. Depending on its output instead of on a tag event keeps
  # this working without a personal access token.
  #
  # The tag condition is the manual escape hatch: pushing a v* tag by hand still
  # releases, for when release-please needs to be bypassed.
  release:
    needs:
      - test
      - release-please
    if: >-
      always() && needs.test.result == 'success' &&
      (needs.release-please.outputs.release_created == 'true' ||
      startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          # Check out the tag release-please just created, not the branch head,
          # so GoReleaser derives the version from it. Full history for the tag.
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out tap
        uses: actions/checkout@v5
        with:
          repository: todor-a/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Update tap cask
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name || github.ref_name }}
        run: |
          mkdir -p tap/Casks
          cp dist/homebrew/Casks/lazybrew.rb tap/Casks/lazybrew.rb
          rm -f tap/Formula/lazybrew.rb
          ruby -rjson -e '
            path = "tap/tap_migrations.json"
            migrations = File.exist?(path) ? JSON.parse(File.read(path)) : {}
            migrations["lazybrew"] = "lazybrew"
            File.write(path, JSON.pretty_generate(migrations) + "\n")
          '

          cd tap
          # Stage without naming paths: `git add -A -- <pathspec>` exits 128 when a
          # pathspec matches nothing, and Formula/lazybrew.rb stopped existing once
          # the formula-to-cask migration landed, so naming it broke every release
          # after the one that removed it. The checkout is a fresh clone and this
          # step wrote every change in it, so there is nothing else to pick up.
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Tap already up to date"
            exit 0
          fi

          version="${RELEASE_TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "lazybrew ${version}"
          git push origin HEAD:main
