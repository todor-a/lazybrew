name: Release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os:
          - macos-14
          - macos-15-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test -ldflags="-extldflags=-Wl,-adhoc_codesign" ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Release with GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.17.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Check out tap
        uses: actions/checkout@v5
        with:
          repository: todor-a/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - name: Update tap cask
        shell: bash
        run: |
          mkdir -p tap/Casks
          cp dist/homebrew/Casks/lazybrew.rb tap/Casks/lazybrew.rb
          rm -f tap/Formula/lazybrew.rb
          ruby -rjson -e '
            path = "tap/tap_migrations.json"
            migrations = File.exist?(path) ? JSON.parse(File.read(path)) : {}
            migrations["lazybrew"] = "lazybrew"
            File.write(path, JSON.pretty_generate(migrations) + "\n")
          '

          cd tap
          if [[ -z "$(git status --porcelain -- Casks/lazybrew.rb Formula/lazybrew.rb tap_migrations.json)" ]]; then
            echo "Tap already up to date"
            exit 0
          fi

          version="${GITHUB_REF_NAME#v}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- Casks/lazybrew.rb Formula/lazybrew.rb tap_migrations.json
          git commit -m "lazybrew ${version}"
          git push origin HEAD:main
