version: 2

project_name: lazybrew

builds:
  - id: lazybrew
    main: ./cmd/lazybrew
    binary: lazybrew
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - 'CC=clang -arch {{ if eq .Arch "amd64" }}x86_64{{ else }}arm64{{ end }}'
    ldflags:
      - -s -w -extldflags=-Wl,-adhoc_codesign

archives:
  - id: lazybrew
    ids:
      - lazybrew
    formats:
      - tar.gz
    name_template: 'lazybrew_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  # Not github-native: that derives notes from merged pull requests, and this
  # repository lands everything as direct commits, so every release body was just
  # a compare link. Read the commits instead — they are Conventional Commits, so
  # they group cleanly. The workflow already checks out with fetch-depth 0, which
  # this needs to see history between tags.
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '\bfeat(\([^)]+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '\bfix(\([^)]+\))?!?:'
      order: 1
    - title: Performance
      regexp: '\bperf(\([^)]+\))?!?:'
      order: 2
    - title: Build and release
      regexp: '\b(build|ci)(\([^)]+\))?!?:'
      order: 3
    - title: Documentation
      regexp: '\bdocs(\([^)]+\))?!?:'
      order: 4
    - title: Other
      order: 999
  filters:
    exclude:
      - '\btest(\([^)]+\))?!?:'
      - '\bchore(\([^)]+\))?!?:'
      - '\bstyle(\([^)]+\))?!?:'
      - '\brefactor(\([^)]+\))?!?:'
      - '^Merge '

release:
  name_template: 'lazybrew {{ .Version }}'
  replace_existing_artifacts: true

homebrew_casks:
  - name: lazybrew
    ids:
      - lazybrew
    binaries:
      - lazybrew
    repository:
      owner: todor-a
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/todor-a/lazybrew
    description: Terminal UI for inspecting and uninstalling Homebrew packages
    skip_upload: true
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazybrew"]
          end
