version: 2

project_name: lazybrew

builds:
  - id: lazybrew
    main: ./cmd/lazybrew
    binary: lazybrew
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    env:
      - CGO_ENABLED=1
      - 'CC=clang -arch {{ if eq .Arch "amd64" }}x86_64{{ else }}arm64{{ end }}'
    ldflags:
      - -s -w -extldflags=-Wl,-adhoc_codesign

archives:
  - id: lazybrew
    ids:
      - lazybrew
    formats:
      - tar.gz
    name_template: 'lazybrew_{{ .Version }}_{{ .Os }}_{{ .Arch }}'

checksum:
  name_template: checksums.txt

changelog:
  # release-please owns the changelog now. It accumulates entries into
  # CHANGELOG.md on the release pull request and writes the GitHub release body
  # when that pull request merges, so a second changelog generated here would
  # only compete with it.
  disable: true

release:
  name_template: 'lazybrew {{ .Version }}'
  replace_existing_artifacts: true
  # release-please has already created this release, with its own notes. Upload
  # artifacts into it and leave the body alone. This is GoReleaser's default,
  # stated explicitly because the notes are not ours to overwrite.
  mode: keep-existing

homebrew_casks:
  - name: lazybrew
    ids:
      - lazybrew
    binaries:
      - lazybrew
    repository:
      owner: todor-a
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/todor-a/lazybrew
    description: Terminal UI for inspecting and uninstalling Homebrew packages
    skip_upload: true
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lazybrew"]
          end
